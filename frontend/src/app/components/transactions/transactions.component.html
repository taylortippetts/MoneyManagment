<div class="transactions-header">
  <h1>Transactions</h1>
  <button mat-raised-button color="primary" (click)="exportTransactions()">
    <mat-icon>file_download</mat-icon>
    Export CSV
  </button>
</div>

<mat-card class="filter-card">
  <mat-card-content>
    <div class="filter-row">
      <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="filter.search" (keyup.enter)="onFilterChange()" placeholder="Search transactions...">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startPicker" [(ngModel)]="filter.startDate" (dateChange)="onFilterChange()">
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endPicker" [(ngModel)]="filter.endDate" (dateChange)="onFilterChange()">
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select [(ngModel)]="filter.categoryId" (selectionChange)="onFilterChange()">
          <mat-option [value]="null">All Categories</mat-option>
          <mat-option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-stroked-button color="accent" (click)="clearFilters()">Clear Filters</button>
    </div>
  </mat-card-content>
</mat-card>

<mat-card class="table-card">
  <mat-card-content>
    <div *ngIf="loading" class="loading-container">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      <p>Loading transactions...</p>
    </div>

    <div *ngIf="!loading" class="transactions-grid ag-theme-alpine">
      <ag-grid-angular
        style="width: 100%; height: 620px;"
        class="ag-theme-alpine"
        [rowData]="transactions"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [animateRows]="true"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>

    <div *ngIf="!loading && transactions.length === 0" class="no-data">
      <mat-icon>inbox</mat-icon>
      <p>No transactions found</p>
      <p class="hint">Try adjusting your filters or import a CSV file</p>
    </div>

    <mat-paginator 
      *ngIf="!loading && transactions.length > 0"
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50, 100]"
      [pageIndex]="pageIndex"
      (page)="onPaginatorChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </mat-card-content>
</mat-card>
