<mat-toolbar color="primary">
  <button mat-icon-button (click)="snav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>{{ title }}</span>
  <span class="spacer"></span>
  <button mat-button [routerLink]="['/import']">
    <mat-icon>cloud_upload</mat-icon>
    Import CSV
  </button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #snav mode="side" opened class="sidenav">
    <nav mat-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon mat-list-icon>dashboard</mat-icon>
        <span mat-line>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/transactions" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon mat-list-icon>receipt</mat-icon>
        <span mat-line>Transactions</span>
      </a>
      <a mat-list-item routerLink="/categories" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon mat-list-icon>category</mat-icon>
        <span mat-line>Categories</span>
      </a>
      <a mat-list-item routerLink="/import" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon mat-list-icon>cloud_upload</mat-icon>
        <span mat-line>Import CSV</span>
      </a>
      <a mat-list-item routerLink="/reports" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon mat-list-icon>insert_chart</mat-icon>
        <span mat-line>Reports</span>
      </a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
